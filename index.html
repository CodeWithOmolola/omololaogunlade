<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oogun</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      cursor: none;
    }

    /* Custom cursor */
    .cursor {
      position: fixed;
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.15s ease, opacity 0.15s ease;
      mix-blend-mode: difference;
    }

    .cursor-ring {
      position: fixed;
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), width 0.3s ease, height 0.3s ease, border-color 0.3s ease;
    }

    .cursor.hovering { transform: translate(-50%, -50%) scale(0); }
    .cursor-ring.hovering { width: 56px; height: 56px; border-color: rgba(255,255,255,0.9); }

    /* Full-screen video */
    .video-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .video-bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.32);
      z-index: 1;
    }

    /* B.R.B. center overlay */
    .brb-overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .brb-text {
      font-family: 'DM Mono', monospace;
      font-size: clamp(4rem, 12vw, 10rem);
      font-weight: 400;
      color: #fff;
    
      mix-blend-mode: difference;
      user-select: none;
    }

    /* Nav */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 32px 40px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .nav-name {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.75);
      text-transform: uppercase;
      text-decoration: none;
    }

    .nav-name:hover { color: #fff; }

    .nav-right {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
    }

    /* Center nav links */
    .center-links {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .center-links a {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1rem, 2.2vw, 1.5rem);
      font-weight: 400;
      color: rgba(255,255,255,0.82);
      text-decoration: none;
      letter-spacing: 0.06em;
      position: relative;
      transition: color 0.3s ease;
    }

    .center-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 1px;
      background: #fff;
      transition: width 0.4s cubic-bezier(0.16,1,0.3,1);
    }

    .center-links a:hover {
      color: #fff;
    }

    .center-links a:hover::after {
      width: 100%;
    }

    .link-divider {
      width: 1px;
      height: 40px;
      background: rgba(255,255,255,0.2);
    }

    /* Footer */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 28px 40px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .footer-location {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
    }

    .footer-copy {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- Video background -->
  <div class="video-bg">
    <video autoplay muted loop playsinline>
      <source src="https://res.cloudinary.com/djmffrvpg/video/upload/v1781802416/brb_index-2_oufnwf.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- Dark overlay -->
  <div class="overlay"></div>

  <!-- B.R.B. centered text -->
  <div class="brb-overlay">
    <span class="brb-text">B.R.B</span>
  </div>

  <!-- Nav -->
  <nav>
    <a href="/" class="nav-name">Omolola Ogunlade</a>
    <span class="nav-right">© 2026</span>
  </nav>


  <script>
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursorRing');
    let mx = 0, my = 0;

    document.addEventListener('mousemove', e => {
      mx = e.clientX;
      my = e.clientY;
      cursor.style.left = mx + 'px';
      cursor.style.top = my + 'px';
    });

    let ringX = 0, ringY = 0;
    function animateRing() {
      ringX += (mx - ringX) * 0.12;
      ringY += (my - ringY) * 0.12;
      ring.style.left = ringX + 'px';
      ring.style.top = ringY + 'px';
      requestAnimationFrame(animateRing);
    }
    animateRing();

    document.querySelectorAll('a').forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursor.classList.add('hovering');
        ring.classList.add('hovering');
      });
      el.addEventListener('mouseleave', () => {
        cursor.classList.remove('hovering');
        ring.classList.remove('hovering');
      });
    });
  </script>
</body>
</html>
