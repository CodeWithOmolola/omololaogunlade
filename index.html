<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omolola Ogunlade — Strategy. Design. Operations.</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      cursor: none;
    }

    @font-face {
      font-family: 'Akkurat';
      src: url('./fonts/akkurat.woff2') format('woff2'),
        url('./fonts/akkurat.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    body {
      font-family: 'Akkurat', sans-serif;
    }

    /* Custom cursor */
    .cursor {
      position: fixed;
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.15s ease, opacity 0.15s ease;
      mix-blend-mode: difference;
    }

    .cursor-ring {
      position: fixed;
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), width 0.3s ease, height 0.3s ease, border-color 0.3s ease;
    }

    .cursor.hovering {
      transform: translate(-50%, -50%) scale(0);
    }

    .cursor-ring.hovering {
      width: 56px;
      height: 56px;
      border-color: rgba(255, 255, 255, 0.9);
    }

    /* Full-screen video */
    .video-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .video-bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Dark overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.52);
      z-index: 1;
    }

    /* Grain texture */
    .grain {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      animation: grain-shift 0.5s steps(2) infinite;
    }

    @keyframes grain-shift {
      0% {
        transform: translate(0, 0);
      }

      25% {
        transform: translate(-1%, 1%);
      }

      50% {
        transform: translate(1%, -1%);
      }

      75% {
        transform: translate(-1%, -1%);
      }

      100% {
        transform: translate(1%, 1%);
      }
    }

    /* Center content */
    .center {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    /* Nav links */
    .nav-link {
      display: block;
      font-family: 'Akkurat', Arial, sans-serif;
      font-size: clamp(1.5rem, 1.6vw, 1.4rem);;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.82);
      text-decoration: none;
      letter-spacing: 0.01em;
      padding: 0.55em 1.2em;
      position: relative;
      transition: color 0.4s ease;
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .nav-link:nth-child(1) {
      animation-delay: 0.2s;
    }

    .nav-link:nth-child(2) {
      animation-delay: 0.45s;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0.45em;
      left: 1.2em;
      right: 1.2em;
      height: 1px;
      background: rgba(255, 255, 255, 0.3);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease;
    }

    .nav-link:hover {
      color: #fff;
    }

    .nav-link:hover::after {
      transform: scaleX(1);
      background: rgba(255, 255, 255, 0.75);
    }

    /* Divider between links */
    .divider {
      width: 1px;
      height: 1.6em;
      background: rgba(255, 255, 255, 0.18);
      opacity: 0;
      animation: fadeIn 0.6s ease 0.65s forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* Small mark top-left */
    .wordmark {
      position: fixed;
      top: 2.2rem;
      left: 2.4rem;
      z-index: 10;
      font-family: 'Akkurat', Arial, sans-serif;
      font-weight: 400;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.38);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 1s ease 0.8s forwards;
    }

    /* Small year bottom-right */
    .year {
      position: fixed;
      bottom: 2.2rem;
      right: 2.4rem;
      z-index: 10;
      font-family: 'Akkurat', Arial, sans-serif;
      font-weight: 400;
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.18em;
      opacity: 0;
      animation: fadeIn 1s ease 1s forwards;
    }
  </style>
</head>

<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="video-bg">
    <video autoplay muted loop playsinline>
      <source src="https://res.cloudinary.com/djmffrvpg/video/upload/v1778869010/om_video_banner_flfy3w.mp4"
        type="video/mp4" />
      <script>document.querySelector('video').playbackRate = 1.5;</script>
    </video>
  </div>

  <div class="overlay"></div>
  <div class="grain"></div>

  <span class="wordmark">Omolola Ogunlade</span>

  <nav class="center">
    <a href="strategy.html" class="nav-link">Strategy & System Work</a>
    <a href="creative.html" class="nav-link">Creative Work</a>
    <a href="about.html" class="nav-link">About</a>
    <a href="oogun.works.html" class="nav-link">Consulting</a>
    <a href="mailto:omololaaogunlade@outlook.com" class="nav-link">Contact</a>
  </nav>


  <script>
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursorRing');
    let rx = 0, ry = 0;
    let cx = window.innerWidth / 2, cy = window.innerHeight / 2;

    document.addEventListener('mousemove', e => {
      cx = e.clientX; cy = e.clientY;
      cursor.style.left = cx + 'px';
      cursor.style.top = cy + 'px';
    });

    function lerpRing() {
      rx += (cx - rx) * 0.12;
      ry += (cy - ry) * 0.12;
      ring.style.left = rx + 'px';
      ring.style.top = ry + 'px';
      requestAnimationFrame(lerpRing);
    }
    lerpRing();

    document.querySelectorAll('a').forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursor.classList.add('hovering');
        ring.classList.add('hovering');
      });
      el.addEventListener('mouseleave', () => {
        cursor.classList.remove('hovering');
        ring.classList.remove('hovering');
      });
    });
  </script>
</body>

</html>
